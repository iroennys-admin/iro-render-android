<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#0e2433"/>
      <stop offset="100%" stop-color="#04121d"/>
    </radialGradient>
    <linearGradient id="render" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#46e3b7"/>
      <stop offset="50%" stop-color="#37bcff"/>
      <stop offset="100%" stop-color="#a36bff"/>
    </linearGradient>
    <radialGradient id="ring-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#37bcff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#04121d" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="190" fill="url(#ring-glow)"/>

  <!-- Antenna / radar tower -->
  <g transform="translate(256,256)">
    <!-- Base rectangle -->
    <rect x="-12" y="60" width="24" height="100" rx="6" fill="url(#render)"/>

    <!-- Concentric signal arcs -->
    <path d="M -160 0 a 160 160 0 0 1 320 0" stroke="url(#render)" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.35"/>
    <path d="M -110 0 a 110 110 0 0 1 220 0" stroke="url(#render)" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.6"/>
    <path d="M -60 0 a 60 60 0 0 1 120 0" stroke="url(#render)" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.9"/>

    <!-- Center dot -->
    <circle cx="0" cy="0" r="14" fill="#fff"/>
    <circle cx="0" cy="0" r="22" fill="none" stroke="#fff" stroke-width="3" opacity="0.5"/>
  </g>
</svg>
